<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LCTW Silent Auction</title>
  <meta name="description" content="Silent auction of paintings on pandan leaves, supporting the Lao Conservation Trust for Wildlife.">
  <meta name="theme-color" content="#0f4a3e">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Forum&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Forum&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="assets/styles.css?v=16">
</head>
<body>
  <main class="page">
    <section class="hero">
      <img class="logo" src="assets/lctw-logo.png" alt="Lao Conservation Trust for Wildlife">
      <div>
        <h1 id="title"></h1>
        <p id="subtitle"></p>
        <div class="status-pill" id="status"></div>
        <div class="host">
          <span>Hosted by</span>
          <img src="assets/le-charme-logo.jpg" alt="Le Charme Vientiane Hotel">
        </div>
      </div>
    </section>

    <div class="toolbar">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="search" id="q" placeholder="Search by name or lot number" aria-label="Search artworks">
      </div>
      <div class="chips" role="group" aria-label="Filter">
        <button class="chip" data-filter="all" aria-pressed="true">All</button>
        <button class="chip" data-filter="nobids" aria-pressed="false">No bids yet</button>
        <button class="chip" data-filter="mine" aria-pressed="false">My bids</button>
      </div>
      <select id="sort" aria-label="Sort" style="width:auto;flex:0 0 auto">
        <option value="lot">Sort: Lot number</option>
        <option value="az">Sort: A–Z</option>
        <option value="low">Sort: Lowest bid</option>
        <option value="high">Sort: Highest bid</option>
        <option value="popular">Sort: Most bids</option>
      </select>
    </div>

    <div class="grid" id="grid"></div>
  </main>

  <script src="assets/config.js?v=16"></script>
  <script src="assets/items.js?v=16"></script>
  <script src="assets/app.js?v=16"></script>
  <script>
  (function () {
    const A = window.Auction;
    A.renderChrome(location.hash === '#mine' ? 'mine' : 'gallery');
    document.getElementById('title').textContent = A.CFG.title || 'Silent Auction';
    document.getElementById('subtitle').textContent = A.CFG.subtitle || '';
    A.mountStatus(document.getElementById('status'));

    const grid = document.getElementById('grid');
    const q = document.getElementById('q');
    const sortSel = document.getElementById('sort');
    let filter = location.hash === '#mine' ? 'mine' : 'all';

    function setFilter(f) {
      filter = f;
      A.$$('.chip').forEach(function (c) { c.setAttribute('aria-pressed', String(c.dataset.filter === f)); });
      A.$$('.topnav a').forEach(function (a) { a.classList.toggle('active', (f === 'mine') === a.getAttribute('href').endsWith('#mine')); });
      draw();
    }
    A.$$('.chip').forEach(function (c) { c.addEventListener('click', function () { setFilter(c.dataset.filter); history.replaceState(null, '', c.dataset.filter === 'mine' ? '#mine' : '#'); }); });
    window.addEventListener('hashchange', function () { setFilter(location.hash === '#mine' ? 'mine' : 'all'); });
    q.addEventListener('input', draw);
    sortSel.addEventListener('change', draw);

    let lastHtml = '';
    function paint(html) { if (html !== lastHtml) { lastHtml = html; grid.innerHTML = html; } }
    function draw() {
      if (!A.ready()) {
        paint(new Array(8).join('<div class="card skeleton"><div class="thumb"></div><div class="body"><div class="sk-line"></div><div class="sk-line short"></div></div></div>'));
        return;
      }
      const term = q.value.trim().toLowerCase();
      const mine = A.myBids();
      const closed = A.isClosed();
      let list = A.ITEMS.map(function (it) { return { it: it, i: A.info(it) }; }).filter(function (x) {
        if (filter === 'nobids' && x.i.count) return false;
        if (filter === 'mine' && !mine[x.it.id]) return false;
        if (term && !(x.it.title.toLowerCase().includes(term) || String(x.it.lot) === term.replace(/^lot\s*/, ''))) return false;
        return true;
      });
      const s = sortSel.value;
      list.sort(function (a, b) {
        if (s === 'az') return a.it.title.localeCompare(b.it.title);
        if (s === 'low') return (a.i.count ? a.i.high : a.it.startingBid) - (b.i.count ? b.i.high : b.it.startingBid);
        if (s === 'high') return (b.i.count ? b.i.high : b.it.startingBid) - (a.i.count ? a.i.high : a.it.startingBid);
        if (s === 'popular') return b.i.count - a.i.count;
        return a.it.lot - b.it.lot;
      });

      if (!list.length) {
        paint('<div class="empty" style="grid-column:1/-1">' +
          '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>' +
          (filter === 'mine' ? 'You haven’t bid on anything yet.<br>Tap <b>Bid</b> on any artwork to get started.' : 'No artworks match.') + '</div>');
        return;
      }

      paint(list.map(function (x) {
        const it = x.it, i = x.i;
        const priceLabel = i.count ? (closed ? 'Winning bid' : 'Current bid') : 'Starting bid';
        const price = i.count ? i.high : it.startingBid;
        const meta = i.count ? i.count + ' bid' + (i.count > 1 ? 's' : '') + ' · ' + A.esc(i.highName) : (A.notStarted() ? 'Bidding opens soon' : 'Be the first to bid');
        return '<article class="card">' +
          '<a class="thumb" href="' + A.esc(A.itemUrl(it)) + '"><img loading="lazy" src="' + A.esc(A.thumb(it)) + '" alt="' + A.esc(it.title) + '">' +
          '<span class="lot-badge">LOT ' + A.esc(it.lot) + '</span><span class="mine">' + A.mineTag(i) + '</span></a>' +
          '<div class="body">' +
          '<h3><a href="' + A.esc(A.itemUrl(it)) + '">' + A.esc(it.title) + '</a></h3>' +
          '<div class="muted small meta-line">' + meta + '</div>' +
          '<div class="price-row"><span class="price-label">' + priceLabel + '</span><span class="price">' + A.money(price) + '</span></div>' +
          (closed || A.notStarted() ? '<a class="btn secondary block" href="' + A.esc(A.itemUrl(it)) + '">View</a>'
                  : '<button class="btn block" data-bid="' + A.esc(it.id) + '">Bid' + (i.count ? ' ' + A.money(i.minimum) + '+' : '') + '</button>') +
          '</div></article>';
      }).join(''));
    }

    grid.addEventListener('click', function (e) {
      const b = e.target.closest('[data-bid]'); if (!b) return;
      A.openBidSheet(A.itemById(b.dataset.bid));
    });

    A.onState(draw);
    setFilter(filter);
    A.startPolling();
  })();
  </script>
</body>
</html>
