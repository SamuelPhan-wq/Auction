<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Artwork — LCTW Silent Auction</title>
  <meta name="theme-color" content="#0f4a3e">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Forum&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css?v=10">
</head>
<body class="has-sticky">
  <main class="page" id="page"></main>
  <div class="sticky-bid" id="sticky"></div>
  <div class="lightbox" id="lightbox"><img alt=""></div>

  <script src="assets/config.js?v=10"></script>
  <script src="assets/items.js?v=10"></script>
  <script src="assets/app.js?v=10"></script>
  <script>
  (function () {
    const A = window.Auction;
    const page = document.getElementById('page');
    const id = new URLSearchParams(location.search).get('id');
    const it = A.itemById(id);
    A.renderChrome('');

    if (!it) {
      page.insertAdjacentHTML('beforeend', '<div class="empty"><h2>Artwork not found</h2><p>This QR code or link doesn’t match an artwork.</p><a class="btn" href="index.html">See all artworks</a></div>');
      document.getElementById('sticky').remove();
      return;
    }
    document.title = it.title + ' — Lot ' + it.lot + ' — LCTW Silent Auction';

    const idx = A.ITEMS.indexOf(it);
    const prev = A.ITEMS[(idx - 1 + A.ITEMS.length) % A.ITEMS.length];
    const next = A.ITEMS[(idx + 1) % A.ITEMS.length];

    page.insertAdjacentHTML('beforeend',
      '<div class="item-layout">' +
        '<div class="art-frame"><img id="art" src="' + A.esc(A.full(it)) + '" alt="' + A.esc(it.title) + '"><span class="zoom-hint">Tap to enlarge</span></div>' +
        '<div>' +
          '<div class="panel">' +
            '<div class="kicker" id="kicker"></div>' +
            '<h1 class="item-title" id="art-title">' + A.esc(it.title) + '</h1>' +
            '<div class="muted">' + A.esc(it.medium) + '</div>' +
            '<p id="art-desc" style="margin-top:.6rem"></p>' +
            (it.value ? '<div class="muted small" style="margin-top:.3rem">Estimated value: ' + A.money(it.value) + '</div>' : '') +
            '<div class="current"><div><div class="price-label" id="price-label"></div><div class="price" id="price"></div><div class="muted small" id="price-meta"></div></div><div id="mine"></div></div>' +
            '<div class="status-pill" id="status" style="background:var(--mint-soft);color:var(--brand);margin:0 0 1rem"></div>' +
            '<div id="bid-area"></div>' +
          '</div>' +
          '<div class="panel"><h3 style="margin-top:0">Bid history</h3><ul class="history" id="history"></ul></div>' +
          '<div class="pager">' +
            '<a class="btn secondary small" id="prev-lot" href="' + A.esc(A.itemUrl(prev)) + '">‹ Lot ' + A.esc(prev.lot) + '</a>' +
            '<a class="btn secondary small" href="index.html">All artworks</a>' +
            '<a class="btn secondary small" id="next-lot" href="' + A.esc(A.itemUrl(next)) + '">Lot ' + A.esc(next.lot) + ' ›</a>' +
          '</div>' +
        '</div>' +
      '</div>');

    A.mountStatus(document.getElementById('status'));

    const bidArea = document.getElementById('bid-area');
    function showForm() {
      bidArea.innerHTML = '<h3 style="margin-top:0">Place your bid</h3>' + A.bidFormHtml(it);
      A.wireBidForm(A.$('form', bidArea), it, function (data) {
        bidArea.innerHTML = A.successHtml(it, data) + '<button class="btn secondary block" id="again">Bid again</button>' +
          '<a class="btn block" style="margin-top:.5rem" href="index.html">See more artworks</a>';
        document.getElementById('again').onclick = showForm;
        bidArea.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    }
    showForm();

    const sticky = document.getElementById('sticky');
    sticky.addEventListener('click', function (e) {
      if (!e.target.closest('[data-go]')) return;
      bidArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
      setTimeout(function () { const a = A.$('input[name=amount]', bidArea); if (a) a.focus({ preventScroll: true }); }, 400);
    });

    function draw() {
      const i = A.info(it);
      const closed = A.isClosed();
      // Lot number, name, description and neighbours can be changed from the admin page
      document.getElementById('kicker').textContent = 'Lot ' + it.lot + (it.artist ? ' · ' + it.artist : '');
      const k = A.ITEMS.indexOf(it), pv = A.ITEMS[(k - 1 + A.ITEMS.length) % A.ITEMS.length], nx = A.ITEMS[(k + 1) % A.ITEMS.length];
      const pl = document.getElementById('prev-lot'), nl = document.getElementById('next-lot');
      pl.href = A.itemUrl(pv); pl.textContent = '‹ Lot ' + pv.lot;
      nl.href = A.itemUrl(nx); nl.textContent = 'Lot ' + nx.lot + ' ›';
      document.getElementById('art-title').textContent = it.title;
      document.getElementById('art-desc').textContent = it.description || '';
      document.getElementById('art-desc').hidden = !it.description;
      document.getElementById('art').alt = it.title;
      document.title = it.title + ' — Lot ' + it.lot + ' — LCTW Silent Auction';
      document.getElementById('price-label').textContent = i.count ? (closed ? 'Winning bid' : 'Current bid') : 'Starting bid';
      document.getElementById('price').textContent = A.money(i.count ? i.high : it.startingBid);
      document.getElementById('price-meta').textContent = i.count ? i.count + ' bid' + (i.count > 1 ? 's' : '') + ' · leader: ' + i.highName : (A.notStarted() ? 'Bidding has not started yet' : 'No bids yet — be the first!');
      document.getElementById('mine').innerHTML = A.mineTag(i);
      document.getElementById('history').innerHTML = i.history.length
        ? i.history.map(function (h) { return '<li><span>' + A.esc(h.name) + ' <span class="muted small">· ' + A.esc(A.timeAgo(h.time)) + '</span></span><b>' + A.money(h.amount) + '</b></li>'; }).join('')
        : '<li class="muted" style="font-weight:600">No bids yet.</li>';
      sticky.innerHTML = '<div><div class="price-label">' + (i.count ? 'Current' : 'Start') + '</div><div class="price" style="font-size:1.4rem">' + A.money(i.count ? i.high : it.startingBid) + '</div></div>' +
        (closed ? '<button class="btn secondary" disabled>Bidding closed</button>' : A.notStarted() ? '<button class="btn secondary" disabled>Bidding not started</button>' : '<button class="btn" data-go>Bid ' + A.money(i.minimum) + ' or more</button>');
    }
    A.onState(draw);
    draw();
    A.startPolling();

    // Full-screen zoom
    const lb = document.getElementById('lightbox');
    document.getElementById('art').addEventListener('click', function () { lb.querySelector('img').src = A.full(it); lb.classList.add('open'); });
    lb.addEventListener('click', function () { lb.classList.remove('open'); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') lb.classList.remove('open'); });
  })();
  </script>
</body>
</html>
